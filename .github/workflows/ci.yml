name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum is tidy
        run: |
          go mod tidy
          git diff --exit-code go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race -count=1
