name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly published vulnerabilities
    - cron: "0 8 * * 1"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ""   # uses go-version-file
          go-package: ./...

  gosec:
    name: Gosec Static Analysis
    runs-on: ubuntu-latest
    # NOTE: SARIF upload requires GitHub Advanced Security (free for public repos).
    # When this repo is made public, add back:
    #   permissions:
    #     security-events: write
    #     actions: read
    #     contents: read
    # and restore the upload step below.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Gosec
        run: gosec ./...

      # Uncomment when repo is public to surface findings in the Security tab:
      # - name: Run Gosec (SARIF output)
      #   run: gosec -fmt sarif -out gosec-results.sarif ./...
